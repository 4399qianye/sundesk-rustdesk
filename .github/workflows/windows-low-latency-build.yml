name: Windows Low Latency Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.py"
      - "libs/base/protos/**"
      - "libs/scrap/**"
      - "src/**"
      - "flutter/**"
      - ".github/workflows/windows-low-latency-build.yml"

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"

jobs:
  build-windows-x64:
    name: Windows x64 Flutter low-latency build
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Patch Flutter 3.24 dropdown menu
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
            "$(dirname "$(dirname "$(which flutter)")")"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Generate Flutter Rust bridge
        shell: pwsh
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          Push-Location flutter
          flutter pub get
          Pop-Location
          $codegen = Join-Path $env:CARGO_HOME "bin\flutter_rust_bridge_codegen.exe"
          & $codegen `
            --rust-input ./src/flutter_ffi.rs `
            --dart-output ./flutter/lib/generated_bridge.dart `
            --c-output ./flutter/macos/Runner/bridge_generated.h
          Copy-Item ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h -Force

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-x64-low-latency

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Verify FFmpeg headers
        shell: pwsh
        run: |
          $header = "$env:VCPKG_ROOT/installed/x64-windows-static/include/libavutil/pixfmt.h"
          if (-not (Test-Path $header)) {
            Get-ChildItem "$env:VCPKG_ROOT/installed" -Recurse -Filter pixfmt.h -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "FFmpeg header was not installed: $header"
          }
          Write-Host "Found $header"

      - name: Install Windows Driver Kit
        shell: pwsh
        run: |
          $wdk = "C:\Program Files (x86)\Windows Kits\10\build\10.0.26100.0"
          if (-not (Test-Path $wdk)) {
            Invoke-WebRequest `
              -Uri "https://go.microsoft.com/fwlink/?linkid=2335869" `
              -OutFile "$env:RUNNER_TEMP\wdksetup.exe"
            Start-Process "$env:RUNNER_TEMP\wdksetup.exe" `
              -ArgumentList "/quiet", "/norestart" `
              -Wait -NoNewWindow
          }
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vsInstallPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"
          if (-not (Test-Path $vsInstallPath)) {
            $vsInstallPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community"
          }
          if (-not (Test-Path $vsInstaller) -or -not (Test-Path $vsInstallPath)) {
            throw "Visual Studio Installer or installation path is not available"
          }
          Start-Process $vsInstaller -ArgumentList "modify", "--installPath", $vsInstallPath, "--add", "Microsoft.VisualStudio.Component.WindowsDriverKit", "--quiet", "--norestart" -Wait -NoNewWindow

      - name: Build RustDesk virtual HID driver
        continue-on-error: false
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe is not available on the runner"
          }
          $msbuildPaths = @(& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe)
          if ($msbuildPaths.Count -eq 0) {
            throw "MSBuild is not installed on the runner"
          }
          $vsPath = & $vswhere -latest -products * -property installationPath
          $cl = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Filter cl.exe -Recurse |
            Where-Object { $_.FullName -like '*Hostx64*x64*' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $cl) {
            throw "MSVC x64 compiler was not found"
          }
          $kitRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $ntddkHeader = Get-ChildItem "$kitRoot\Include" -Filter ntddk.h -Recurse |
            Select-Object -First 1
          if (-not $ntddkHeader) {
            throw "WDK ntddk.h was not installed under $kitRoot"
          }
          $include = Split-Path $ntddkHeader.DirectoryName -Parent
          $kitVersion = Split-Path $include -Leaf
          Write-Host "Using WDK headers from $include"
          $source = (Resolve-Path "drivers/rustdesk_hid/driver.c").Path
          $outDir = Join-Path (Resolve-Path "drivers/rustdesk_hid").Path "x64\Release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $lib = "$kitRoot\Lib\$kitVersion"
          $msvcBin = $cl.DirectoryName
          $msvcRoot = Split-Path (Split-Path (Split-Path $msvcBin -Parent) -Parent) -Parent
          $env:Path = "$msvcBin;$env:Path"
          $env:Include = "$include\km;$include\shared;$include\um;$include\ucrt;$msvcRoot\include"
          $env:Lib = "$lib\km\x64;$lib\um\x64;$msvcRoot\lib\x64"
          $obj = Join-Path $outDir "driver.obj"
          $driver = Join-Path $outDir "rustdesk_hid.sys"
          & $cl.FullName /nologo /c /kernel /Zl /W4 /D_AMD64_ /D_KERNEL_MODE /DNTDDI_VERSION=0x0A000000 `
            /I"$include\km" /I"$include\shared" /I"$include\um" /I"$include\ucrt" /I"$msvcRoot\include" /Fo$obj $source
          if ($LASTEXITCODE -ne 0) { throw "Virtual HID driver C compilation failed" }
          & link.exe /nologo /driver /subsystem:native /entry:DriverEntry /out:$driver `
            /LIBPATH:"$lib\km\x64" /LIBPATH:"$lib\um\x64" /LIBPATH:"$msvcRoot\lib\x64" `
            $obj ntoskrnl.lib VhfKm.lib Wdmsec.lib BufferOverflowFastFailK.lib
          if ($LASTEXITCODE -ne 0) { throw "Virtual HID driver link failed" }
          if (-not (Test-Path $driver)) {
            throw "Virtual HID driver was not produced: $driver"
          }

      - name: Copy virtual HID INF
        shell: pwsh
        run: |
          $outDir = (Resolve-Path "drivers/rustdesk_hid/x64/Release").Path
          Copy-Item "drivers/rustdesk_hid/rustdesk_hid.inf" $outDir -Force

      - name: Sign virtual HID driver binary
        if: env.SIGN_BASE_URL != '' && env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          pip3 install requests
          BASE_URL="${{ secrets.SIGN_BASE_URL }}" SECRET_KEY="${{ secrets.SIGN_SECRET_KEY }}" \
            python3 res/job.py sign_files drivers/rustdesk_hid/x64/Release --only-ext sys

      - name: Generate virtual HID driver catalog
        shell: pwsh
        run: |
          $outDir = (Resolve-Path "drivers/rustdesk_hid/x64/Release").Path
          $kitRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $inf2cat = Get-ChildItem "$kitRoot\bin" -Filter Inf2Cat.exe -Recurse |
            Select-Object -First 1
          if (-not $inf2cat) { throw "Inf2Cat.exe was not installed with the WDK" }
          & $inf2cat.FullName /driver:$outDir /os:10_X64 /verbose
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed for the virtual HID package" }
          $cat = Join-Path $outDir "rustdesk_hid.cat"
          if (-not (Test-Path $cat)) { throw "Virtual HID catalog was not produced: $cat" }

      - name: Sign virtual HID catalog
        if: env.SIGN_BASE_URL != '' && env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          BASE_URL="${{ secrets.SIGN_BASE_URL }}" SECRET_KEY="${{ secrets.SIGN_SECRET_KEY }}" \
            python3 res/job.py sign_files drivers/rustdesk_hid/x64/Release --only-ext cat

      - name: Verify HID signing configuration
        shell: pwsh
        run: |
          if ("${{ secrets.SIGN_BASE_URL }}" -eq "") {
            Write-Warning "SIGN_BASE_URL is not configured; rustdesk_hid.sys will remain unsigned and cannot load on normal Windows."
          }

      - name: Build Windows low-latency client
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            python build.py --portable --hwcodec --flutter --vram --low-latency-video --skip-portable-pack
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $attempts) {
              Write-Host "Cargo build failed; retrying in 20 seconds ($attempt/$attempts)."
              Start-Sleep -Seconds 20
            }
          }
          exit 1

      - name: Verify binary
        shell: pwsh
        run: |
          $binary = "flutter/build/windows/x64/runner/Release/rustdesk.exe"
          if (-not (Test-Path $binary)) {
            throw "Expected Windows binary was not produced: $binary"
          }
          foreach ($file in @(
            "flutter/build/windows/x64/runner/Release/rustdesk_hid.sys",
            "flutter/build/windows/x64/runner/Release/rustdesk_hid.inf",
            "flutter/build/windows/x64/runner/Release/rustdesk_hid.cat"
          )) {
            if (-not (Test-Path $file)) { throw "Expected HID package file was not produced: $file" }
          }
          Get-Item $binary | Format-List FullName,Length,LastWriteTime

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64-low-latency
          path: flutter/build/windows/x64/runner/Release
          if-no-files-found: error
